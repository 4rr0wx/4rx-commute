services:
  commute:
    build: .
    image: 4rx-commute:latest
    container_name: 4rx-commute
    restart: always
    ports:
      # Bound to localhost only — expose publicly via the dev server's reverse proxy.
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DB_PATH: "/data/delays.sqlite"
    volumes:
      - commute_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/route"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  commute_data:
