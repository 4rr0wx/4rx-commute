services:
  commute:
    build: .
    image: 4rx-commute
    container_name: 4rx-commute
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ORIGIN_NAME:  "Pottschach"
      TRANSFER_NAME: "Wien Meidling"
      DEST_NAME:    "Wien Westbahnhof"
      ORIGIN_ID:    "8100173"
      TRANSFER_ID:  "1290401"
      DEST_ID:      "1190100"
      POLL_INTERVAL_MIN: "5"
      LOOKAHEAD_MIN: "90"
      # Flip to "1" to run without hitting the live HAFAS endpoint.
      SIMULATE_HAFAS: "0"
      DB_PATH: "/data/delays.sqlite"
    volumes:
      - ./data:/data
